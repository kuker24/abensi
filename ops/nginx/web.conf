server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite content-hashed build output. Missing hashes must 404 (not SPA HTML),
  # otherwise browsers can cache index.html as JS under an immutable .js URL.
  # Use add_header without "always" (and no expires) so 404 is not long-cached.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # App shell + client routes: revalidate HTML so deploys pick up new asset hashes.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
